<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>English Tenses · Recognize the Use</title>
<style>
:root{font-family:system-ui,-apple-system,Segoe UI,sans-serif;color:#17233c;background:#f5f7fb}*{box-sizing:border-box}body{margin:0}main{max-width:900px;margin:auto;padding:30px 16px 80px}h1{font-size:clamp(1.7rem,4vw,2.5rem);margin-bottom:8px}.intro{color:#53627a;line-height:1.6}.top{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap}.card{background:white;border:1px solid #dae2ef;border-radius:14px;padding:20px;margin:15px 0;box-shadow:0 3px 12px #1c37600b}.sentence{font-size:1.08rem;font-weight:650;margin:0 0 16px}.fields{display:grid;grid-template-columns:1fr 1fr;gap:14px}label{display:block;font-weight:600;font-size:.9rem;margin-bottom:7px}select{width:100%;padding:11px;border:1px solid #a9b8cd;border-radius:8px;background:white;color:#17233c;font:inherit;min-width:0}.result{margin-top:13px;font-size:.92rem;line-height:1.6}.correct{color:#137345}.wrong{color:#a52233}.actions{position:sticky;bottom:0;background:#f5f7fbef;backdrop-filter:blur(8px);padding:15px 0;display:flex;gap:12px;align-items:center;flex-wrap:wrap}button{border:0;border-radius:9px;padding:12px 20px;background:#244d9b;color:white;font:inherit;font-weight:700;cursor:pointer}button.secondary{background:#e4eaf5;color:#243f76}button:focus-visible,select:focus-visible{outline:3px solid #f4aa34;outline-offset:2px}#score{font-weight:700}a{color:#244d9b}@media(max-width:620px){.fields{grid-template-columns:1fr}.card{padding:15px}}
</style></head><body><main><div class="top"><a href="./">← Back to LexiForge Exercises</a><span>24 sentences · 48 points</span></div>
<h1>Recognizing English Tenses</h1><p class="intro">Identify both the <strong>tense</strong> and its <strong>specific use</strong> in each sentence. There are 12 tense structures and two uses per structure. Questions are mixed. Earn one point for each correct selection.</p>
<div id="questions"></div><div class="actions"><button id="check">Check answers</button><button id="reset" class="secondary">Start again</button><span id="score" role="status" aria-live="polite"></span></div></main>
<script>
const tenses=["Present Simple","Present Continuous","Past Simple","Past Continuous","Present Perfect Simple","Present Perfect Continuous","Past Perfect Simple","Past Perfect Continuous","Future Simple","Future Continuous","Future Perfect Simple","Be Going To"];
const uses=["Habits and routines","General facts and truths","Actions happening now","Temporary situations","Completed past actions","Past habits","Actions in progress at a specific past time","Actions interrupted by another event","Life experiences","Past actions with present results","Actions continuing from the past until now","Recently finished activities with present results","Actions completed before another past event","Explaining past situations","Duration before another past event","Explaining past results","Spontaneous decisions","Predictions based on opinions","Actions in progress at a future time","Actions in progress when another future event happens","Completion before a future deadline","Completion before another future event","Future plans and intentions","Predictions based on present evidence"];
const questions=[["I was watching TV when someone knocked on the door.",3,7],["Look at those dark clouds! It's going to rain.",11,23],["I've visited London three times.",4,8],["She works in a hospital.",0,0],["By the time you arrive, I'll have finished dinner.",10,21],["I'm staying with my parents this week.",1,3],["I had been studying for three hours when my friend called.",7,14],["I'm tired. I'll make myself a cup of coffee.",8,16],["I visited my grandparents last weekend.",2,4],["I've been working on this project since Monday.",5,10],["This time tomorrow, I'll be flying to New York.",9,18],["I couldn't get into the house because I'd lost my keys.",6,13],["Water freezes at 0°C.",0,1],["I'm going to start exercising regularly next month.",11,22],["She was cooking dinner at 7 p.m. yesterday.",3,6],["I've eaten too much, so I don't feel well.",4,9],["I drank coffee every morning when I was younger.",2,5],["I'll be working when you get home.",9,19],["She had left the office before I arrived.",6,12],["He's drinking coffee right now.",1,2],["I think our team will win the match.",8,17],["She was exhausted because she'd been working all day.",7,15],["I've been cleaning the house, so my clothes are dirty.",5,11],["I'll have completed the report by Friday.",10,20]];
const container=document.getElementById('questions');
const makeSelect=(values,placeholder,cls,index)=>{const s=document.createElement('select');s.className=cls;s.setAttribute('aria-label',placeholder+' for question '+(index+1));s.add(new Option(placeholder,''));values.forEach((v,i)=>s.add(new Option(v,String(i))));return s;};
questions.forEach(([sentence],i)=>{const card=document.createElement('section');card.className='card';const p=document.createElement('p');p.className='sentence';p.textContent=(i+1)+'. '+sentence;card.append(p);const fields=document.createElement('div');fields.className='fields';for(const [labelText,values,cls] of [['Tense',tenses,'tense'],['Use',uses,'use']]){const wrap=document.createElement('div');const label=document.createElement('label');label.textContent=labelText;const select=makeSelect(values,'Choose '+labelText.toLowerCase(),cls,i);select.id=cls+'-'+i;label.htmlFor=select.id;wrap.append(label,select);fields.append(wrap);}card.append(fields);const feedback=document.createElement('div');feedback.className='result';feedback.setAttribute('aria-live','polite');card.append(feedback);container.append(card);});
document.getElementById('check').addEventListener('click',()=>{let score=0;document.querySelectorAll('.card').forEach((card,i)=>{const [sentence,ti,ui]=questions[i];const a=card.querySelector('.tense').value;const b=card.querySelector('.use').value;const tc=a===String(ti),uc=b===String(ui);score+=Number(tc)+Number(uc);const result=card.querySelector('.result');result.replaceChildren();for(const [ok,kind,answer] of [[tc,'Tense',tenses[ti]],[uc,'Use',uses[ui]]]){const line=document.createElement('div');line.className=ok?'correct':'wrong';line.textContent=(ok?'✓ ':'✗ ')+kind+': '+answer;result.append(line);}});document.getElementById('score').textContent='Score: '+score+' / 48';});
document.getElementById('reset').addEventListener('click',()=>{document.querySelectorAll('select').forEach(s=>s.value='');document.querySelectorAll('.result').forEach(e=>e.replaceChildren());document.getElementById('score').textContent='';window.scrollTo({top:0,behavior:'smooth'});});
</script></body></html>
